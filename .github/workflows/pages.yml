name: Deploy Inventory Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html inventory-listing.html inventory-details.html styles.css inventory-page.css app.js icons.js inventory-layouts.js inventory-layouts.css inventory-core.js inventory-page.js widgets.js .nojekyll _site/
          cp -R assets vendor examples _site/
          node --check _site/app.js
          node --check _site/widgets.js
          node --check _site/inventory-core.js
          node --check _site/inventory-page.js
          node --check _site/icons.js
          node --check _site/inventory-layouts.js
          test -s _site/index.html
          test -s _site/styles.css
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
