<script>
// Un buen candidato a widget global: comportamiento realmente común.
// No depende de .grid-total, .compact-pricing ni de una marca.
// No envía datos: solo cuenta clics en memoria en esta ejecución.
(function ($) {
  const page = $('.inventory-page');
  page.find('.demo-shared-counter').remove();
  const counter = $('<div class="demo-shared-counter">')
    .text('Widget común: 0 clics de consulta (solo esta página)')
    .css({padding:'10px',background:'#e8f7f4',color:'#145952',fontSize:'12px'}).prependTo(page);
  let clicks = 0;
  $(document).off('click.demoShared', '.vehicle-action')
    .on('click.demoShared', '.vehicle-action', function () {
      counter.text('Widget común: ' + (++clicks) + ' clics de consulta (solo esta página)');
    });
})(jQuery);

</script>
